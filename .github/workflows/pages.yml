name: Check manifests and deploy to GitHub Pages

on:
  push:
    branches: [main]      # tags are not a trigger: a pushed old tag would check out and deploy an old tree (seen 2026-09-22)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags are the version source; a shallow clone has none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests
      - run: python tools/check_manifest.py
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site (each game folder + shared only; tools, tests, docs and CI never publish)
        run: |
          rm -rf _site && mkdir -p _site/shared
          cp -r shared/. _site/shared/
          for m in */spoke.json; do d=$(dirname "$m"); mkdir -p "_site/$d"; cp -r "$d/." "_site/$d/"; done
          find _site -type d -name __pycache__ -prune -exec rm -rf {} +
          ls -R _site | head -40
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
