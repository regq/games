<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fill the Band</title>
<meta name="description" content="game-01: one button. Hold to fill the gauge, release inside the band. Three levels, the band shrinks.">
<meta property="og:type" content="website">
<meta property="og:title" content="Fill the Band">
<meta property="og:description" content="One button. Three levels. Thirty seconds. Hold to fill, let go inside the band.">
<meta property="og:url" content="https://regq.github.io/games/game-01/">
<meta property="og:image" content="https://regq.github.io/games/game-01/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fill the Band">
<meta name="twitter:description" content="One button. Three levels. Thirty seconds. Hold to fill, let go inside the band.">
<meta name="twitter:image" content="https://regq.github.io/games/game-01/og.png">
<style>
  :root { --bg: #0f1115; --fg: #e8e6e1; --dim: #8a8f98; --band: #2f7d4f; --fill: #d9a441; --bad: #b5453e; --card: #181b22; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f6f3ec; --fg: #1b1d22; --dim: #5d626b; --card: #ffffff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  main { width: min(420px, 100%); display: grid; gap: 14px; text-align: center; }
  h1 { font-size: 1.3rem; margin: 0; }
  .gauge { position: relative; height: 320px; width: 96px; margin: 0 auto; background: var(--card); border: 2px solid var(--dim); border-radius: 12px; overflow: hidden; }
  .band { position: absolute; left: 0; right: 0; background: var(--band); opacity: .55; }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--fill); transition: none; }
  .fill.bad { background: var(--bad); }
  button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 2px solid var(--dim); background: var(--card); color: var(--fg); cursor: pointer; }
  button.big { font-size: 1.15rem; padding: 18px; width: 100%; touch-action: none; user-select: none; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .status { min-height: 1.6em; color: var(--dim); }
  .dev { display: none; text-align: left; font-size: .85rem; border-top: 1px dashed var(--dim); padding-top: 10px; }
  .dev.on { display: block; }
  textarea { width: 100%; height: 120px; font: 12px/1.3 ui-monospace, monospace; background: var(--card); color: var(--fg); border: 1px solid var(--dim); }
  .hidden { display: none; }
  .tip { margin: 0; color: var(--dim); font-size: .95rem; }
  .tip a { color: var(--fill); }
  .support { margin: 4px 0 0; font-size: .8rem; }
  .support a { color: var(--dim); text-decoration: none; border-bottom: 1px dotted var(--dim); }
  .support a:hover, .support a:focus { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Fill the Band</h1>
  <p id="hint">Hold the button to fill. Let go inside the green band. Three levels; the band shrinks.</p>
  <div class="gauge" aria-hidden="true">
    <div class="band" id="band"></div>
    <div class="fill" id="fill"></div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">Level 1 of 3</div>
  <button class="big" id="hold" aria-label="Hold to fill; or tap once to start and tap again to stop">Hold to fill</button>
  <div class="row hidden" id="after">
    <button id="up" aria-label="Thumbs up">👍 Liked it</button>
    <button id="down" aria-label="Thumbs down">👎 Not for me</button>
    <button id="again">Play again</button>
  </div>
  <p class="tip hidden" id="tip">
    Made by one person, free, no ads.
    <a id="tip-link" href="#" rel="noopener external" target="_blank">Buy me a coffee ☕</a>
  </p>
  <div class="row">
    <button id="report" aria-label="Report a problem">Report a problem</button>
  </div>
  <p class="support hidden" id="support">
    <a id="support-link" href="#" rel="noopener external" target="_blank">Support this ☕</a>
  </p>
  <section class="dev" id="dev" aria-label="Developer overlay">
    <div>dev overlay · events stored: <span id="count">0</span> · player <code id="uid"></code></div>
    <div class="row">
      <button id="export" aria-label="Export events as JSONL">Export</button>
      <button id="reset" aria-label="Reset player">Reset player</button>
    </div>
    <textarea id="jsonl" aria-label="Exported events (JSONL)" readonly></textarea>
  </section>
</main>
<script src="../shared/telemetry.js"></script>
<script src="game.js"></script>
</body>
</html>
